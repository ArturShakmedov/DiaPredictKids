<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход для врача — NDST</title>
<meta name="description" content="Вход в кабинет врача NDST.">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/base.css">
<link rel="stylesheet" href="/styles/auth.css">
</head>
<body data-auth-url="/api/auth/register" data-auth-home="/doctor">

<main class="auth">
  <div class="auth__glow" aria-hidden="true"></div>

  <div class="auth__card">
    <a class="logo auth__logo" href="/" aria-label="NDST — на главную">
      <span class="logo__word" translate="no">NDST<span class="logo__dot">.</span></span>
    </a>

    <h1 class="auth__title">Регистрация врача</h1>
    <p class="auth__lead">Учётная запись врача заводится по коду клиники. Код выдаёт
       тот, кто отвечает за платформу в вашей клинике.</p>

    <form id="loginForm" class="auth__form" novalidate>
      <div class="field">
        <label for="name">Имя и фамилия</label>
        <input class="input" type="text" id="name" name="name"
               autocomplete="name" placeholder="Например, Е. Ковалёва" required>
      </div>

      <div class="field">
        <label for="code">Код клиники</label>
        <input class="input" type="text" id="code" name="code"
               autocomplete="off" placeholder="NDST-XXXX-XXXX" required>
      </div>

      <div class="field">
        <label for="email">Рабочая почта</label>
        <input class="input" type="email" id="email" name="email"
               autocomplete="username" placeholder="doctor@clinic.uz" required>
      </div>

      <div class="field">
        <label for="password">Пароль</label>
        <input class="input" type="password" id="password" name="password"
               autocomplete="new-password" placeholder="Не менее 8 символов" required>
      </div>

      <p class="auth__error" id="loginError" hidden></p>

      <button class="btn btn-primary btn-block btn-lg" type="submit" id="loginBtn">
        Зарегистрироваться <i data-icon="arrow-right"></i>
      </button>
    </form>

    <p class="auth__alt">Уже есть доступ?
      <a href="/login">Войти в кабинет врача</a></p>

    <a class="auth__back" href="/"><i data-icon="arrow-left"></i> На главную</a>
  </div>
</main>

<script src="/scripts/i18n.js"></script>
<script src="/scripts/icons.js"></script>
<script src="/scripts/auth.js"></script>
</body>
</html>
